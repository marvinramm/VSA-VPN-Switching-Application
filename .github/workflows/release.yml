name: Release

# Runs when a tag like v1.0.0 is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# or manually via Actions → Release → "Run workflow" (the tag is then derived from versionName).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Release $TAG"

      # Optional: own release key via repository secrets (see docs/RELEASE.md).
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VSA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "VSA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using own release key."
          else
            echo "No secret set - using the shared project key from signing/."
          fi

      - name: Build release APK
        env:
          VSA_KEYSTORE_PASSWORD: ${{ secrets.VSA_KEYSTORE_PASSWORD }}
          VSA_KEY_ALIAS: ${{ secrets.VSA_KEY_ALIAS }}
          VSA_KEY_PASSWORD: ${{ secrets.VSA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK and create checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk "VSA-${VERSION}.apk"
          sha256sum "VSA-${VERSION}.apk" > "VSA-${VERSION}.apk.sha256"
          # Use this version's CHANGELOG section as release notes
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          sed "s|REPO_URL|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}|g" docs/release-footer.md >> release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: VSA ${{ env.TAG }}
          body_path: release-notes.md
          files: |
            VSA-*.apk
            VSA-*.apk.sha256
