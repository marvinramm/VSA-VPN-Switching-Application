name: Release

# Startet, sobald ein Tag wie v1.0.0 gepusht wird:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Optional: eigener Release-Schlüssel über Repository-Secrets (siehe docs/RELEASE.md).
      - name: Signierschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.VSA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "VSA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Eigener Release-Schlüssel wird verwendet."
          else
            echo "Kein Secret gesetzt – gemeinsamer Projektschlüssel aus signing/ wird verwendet."
          fi

      - name: Release-APK bauen
        env:
          VSA_KEYSTORE_PASSWORD: ${{ secrets.VSA_KEYSTORE_PASSWORD }}
          VSA_KEY_ALIAS: ${{ secrets.VSA_KEY_ALIAS }}
          VSA_KEY_PASSWORD: ${{ secrets.VSA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: APK umbenennen und Prüfsumme erzeugen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "VSA-${VERSION}.apk"
          sha256sum "VSA-${VERSION}.apk" > "VSA-${VERSION}.apk.sha256"
          # Abschnitt dieser Version aus dem CHANGELOG als Release-Text
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          sed "s|REPO_URL|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}|g" docs/release-footer.md >> release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: VSA ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            VSA-*.apk
            VSA-*.apk.sha256
